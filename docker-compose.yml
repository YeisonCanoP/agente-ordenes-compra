# Levanta el agente en local con un comando: docker compose up --build
services:
  agente:
    build: .
    # PUERTO_PUBLICO=80 publica el chat en el puerto HTTP del servidor (por ejemplo en EC2).
    ports:
      - "${PUERTO_PUBLICO:-3000}:3000"
    env_file: .env
    restart: unless-stopped
    environment:
      PORT: 3000
